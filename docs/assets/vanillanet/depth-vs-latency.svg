<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="470" rx="20" fill="#0e1628"/>
  <text x="48" y="58" fill="#dde8f5" font-size="30" font-weight="800" letter-spacing="-0.5">On a modern GPU, depth — not FLOPs — sets the latency</text>
  <text x="48" y="88" fill="#7a8faa" font-size="16">A100, batch size 1. A “cheap” deep net can be slower than an “expensive” shallow one. Bar length ∝ latency.</text>

  <!-- column headers -->
  <g font-size="12" fill="#3d5070" font-family="JetBrains Mono, monospace" letter-spacing="1">
    <text x="48" y="128">MODEL</text>
    <text x="360" y="128" text-anchor="end">DEPTH</text>
    <text x="470" y="128" text-anchor="end">FLOPs</text>
    <text x="540" y="128">LATENCY (batch size 1, A100)</text>
  </g>
  <line x1="48" y1="140" x2="1152" y2="140" stroke="#1e2d47"/>

  <!-- rows: scale 1ms = 90px, start x=540, max ~10.5ms -->
  <!-- MobileNetV3-L 7.83ms 48 deep 0.22B -->
  <g transform="translate(0,168)">
    <text x="48" y="22" fill="#dde8f5" font-size="16" font-weight="600">MobileNetV3-L</text>
    <text x="360" y="22" fill="#7a8faa" font-size="15" text-anchor="end">48</text>
    <text x="470" y="22" fill="#7a8faa" font-size="15" text-anchor="end">0.22B</text>
    <rect x="540" y="2" width="612" height="26" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <rect x="540" y="2" width="587" height="26" rx="6" fill="#c2410c"/>
    <text x="1117" y="20" fill="#fff" font-size="13" font-weight="600" text-anchor="end" font-family="JetBrains Mono, monospace">7.83 ms</text>
  </g>
  <!-- ResNet-50 7.64ms 50 4.1B -->
  <g transform="translate(0,210)">
    <text x="48" y="22" fill="#dde8f5" font-size="16" font-weight="600">ResNet-50</text>
    <text x="360" y="22" fill="#7a8faa" font-size="15" text-anchor="end">50</text>
    <text x="470" y="22" fill="#7a8faa" font-size="15" text-anchor="end">4.1B</text>
    <rect x="540" y="2" width="612" height="26" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <rect x="540" y="2" width="573" height="26" rx="6" fill="#c2410c"/>
    <text x="1103" y="20" fill="#fff" font-size="13" font-weight="600" text-anchor="end" font-family="JetBrains Mono, monospace">7.64 ms</text>
  </g>
  <!-- Swin-T 10.51 48 4.5B -->
  <g transform="translate(0,252)">
    <text x="48" y="22" fill="#dde8f5" font-size="16" font-weight="600">Swin-T</text>
    <text x="360" y="22" fill="#7a8faa" font-size="15" text-anchor="end">48</text>
    <text x="470" y="22" fill="#7a8faa" font-size="15" text-anchor="end">4.5B</text>
    <rect x="540" y="2" width="612" height="26" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <rect x="540" y="2" width="612" height="26" rx="6" fill="#dc2626"/>
    <text x="1142" y="20" fill="#fff" font-size="13" font-weight="600" text-anchor="end" font-family="JetBrains Mono, monospace">10.51 ms</text>
  </g>
  <!-- VanillaNet-13 4.26 13 11.9B -->
  <g transform="translate(0,294)">
    <text x="48" y="22" fill="#4f8ef7" font-size="16" font-weight="700">VanillaNet-13</text>
    <text x="360" y="22" fill="#7a8faa" font-size="15" text-anchor="end">13</text>
    <text x="470" y="22" fill="#7a8faa" font-size="15" text-anchor="end">11.9B</text>
    <rect x="540" y="2" width="612" height="26" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <rect x="540" y="2" width="320" height="26" rx="6" fill="url(#fast)"/>
    <text x="850" y="20" fill="#fff" font-size="13" font-weight="600" text-anchor="end" font-family="JetBrains Mono, monospace">4.26 ms</text>
  </g>
  <!-- VanillaNet-9 2.91 9 8.6B -->
  <g transform="translate(0,336)">
    <text x="48" y="22" fill="#4f8ef7" font-size="16" font-weight="700">VanillaNet-9</text>
    <text x="360" y="22" fill="#7a8faa" font-size="15" text-anchor="end">9</text>
    <text x="470" y="22" fill="#7a8faa" font-size="15" text-anchor="end">8.6B</text>
    <rect x="540" y="2" width="612" height="26" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <rect x="540" y="2" width="218" height="26" rx="6" fill="url(#fast)"/>
    <text x="748" y="20" fill="#fff" font-size="13" font-weight="600" text-anchor="end" font-family="JetBrains Mono, monospace">2.91 ms</text>
  </g>

  <defs>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <line x1="48" y1="384" x2="1152" y2="384" stroke="#1e2d47"/>
  <text x="48" y="424" fill="#34d399" font-size="15" font-weight="600">VanillaNet-13 has 54× the FLOPs of MobileNetV3-L — and runs ~45% faster. The lesson: cut layers, not FLOPs.</text>
</svg>
